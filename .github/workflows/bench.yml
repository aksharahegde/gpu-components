name: bench

# Written as part of backfilling PLAN.md's Phase 0 — NOT YET VERIFIED by an actual push/PR run.
# Confirm on the first real trigger; adjust cache paths / Playwright browser install step if the
# environment behaves differently in Actions than it did locally.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly, for the vgpu/node trend script — see ci/trend.mjs's own doc comment.
    - cron: "0 6 * * *"

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck --workspace=apps/bench
      - run: npm run test --workspace=apps/bench
      - name: Install Playwright Chromium
        run: npx --prefix apps/bench playwright install --with-deps chromium
      # Push/PR: the quick subset (fast feedback, catches a broken harness). The full 6-size ×
      # 3-shape matrix is slow (5M/10M-span cells alone can take minutes) — reserved for the
      # nightly schedule so it doesn't block every PR.
      # GitHub's hosted runners have no GPU. Reaching for a WebGPU adapter there does not fail
      # gracefully, it kills the GPU process, so the WebGPU scenarios are skipped rather than
      # attempted — see apps/bench/tests/webgpuAvailable.ts. They print what they skipped.
      #
      # This is deliberately not solved with SwiftShader: that would make the job green and the
      # numbers meaningless, and PRODUCT.md forbids publishing a figure the harness did not
      # honestly produce. Restoring WebGPU coverage here means a runner with a real GPU — at which
      # point delete this variable, and nothing else needs to change.
      - name: Run benchmark matrix (quick subset)
        if: github.event_name != 'schedule'
        env:
          BENCH_SKIP_WEBGPU: "1"
        run: npm run bench:quick --workspace=apps/bench
      - name: Run benchmark matrix (full, nightly)
        if: github.event_name == 'schedule'
        env:
          BENCH_SKIP_WEBGPU: "1"
        run: npm run bench --workspace=apps/bench
      - name: Run vgpu/node trend script (headless WebGPU)
        run: npm run trend --workspace=apps/bench
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-results
          path: |
            apps/bench/results/BASELINES.md
            apps/bench/results/baselines.json
            apps/bench/results/trend.jsonl
