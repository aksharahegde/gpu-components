<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gpu-components — GPU components that share one device</title>
    <meta
      name="description"
      content="A framework-independent WebGPU runtime for application components, built on vgpu. One device, one frame, one submit, across every component on the page."
    />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Runs before first paint so the page never flashes the wrong theme.
      // Mirrored by `theme.tsx`, which reads this attribute back on mount.
      ;(function () {
        var stored = localStorage.getItem('theme')
        var theme = stored === 'light' ? 'light' : 'dark'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      })()
    </script>
    <meta property="og:title" content="gpu-components" />
    <meta
      property="og:description"
      content="A framework-independent WebGPU runtime for application components. One device, one frame, one submit."
    />
    <meta property="og:type" content="website" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0d11'/%3E%3Crect x='6' y='9' width='20' height='3' rx='1.5' fill='%238b9dff'/%3E%3Crect x='6' y='14.5' width='13' height='3' rx='1.5' fill='%235be9b9'/%3E%3Crect x='6' y='20' width='17' height='3' rx='1.5' fill='%238b9dff' opacity='.55'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
